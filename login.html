<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Entrar — Leeds.IA</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#302700,transparent 55%),#090909;color:#f7f7f7;font-family:system-ui,sans-serif}.card{width:min(420px,100%);border:1px solid #303030;background:#121212;border-radius:22px;padding:27px}.brand{font-size:22px;font-weight:900}.brand b{display:inline-grid;place-items:center;background:#ffd400;color:#111;border-radius:10px;width:39px;height:39px;margin-right:9px}.brand span{color:#ffd400}h1{font-size:27px;margin:30px 0 8px}p{color:#aaa;font-size:14px;line-height:1.6}label{display:block;font-size:13px;margin:20px 0 8px}input{width:100%;padding:14px;background:#090909;border:1px solid #393939;border-radius:10px;color:white;font:inherit}button{width:100%;margin-top:13px;padding:14px;border:0;border-radius:10px;background:#ffd400;color:#111;font-weight:900;font:inherit;cursor:pointer}.msg{display:none;margin-top:12px;color:#ffb4b4;font-size:13px}.msg.show{display:block}</style></head><body><main class="card"><div class="brand"><b>L</b>Leeds<span>.IA</span></div><h1>Seu espaço privado.</h1><p>Entre com sua senha para abrir seu criador de sites e buscador de leads.</p><form id="f"><label for="pw">Senha de acesso</label><input id="pw" type="password" autocomplete="current-password" required><button id="btn">Entrar no Leeds.IA →</button></form><div class="msg" id="msg"></div></main><script>f.onsubmit=async e=>{e.preventDefault();btn.disabled=true;try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível entrar');location.href='/'}catch(e){msg.textContent=e.message;msg.className='msg show'}finally{btn.disabled=false}}</script></body></html>
